
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dbeafe, #e9d5ff);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      max-width: 500px;
      width: 85%;
      box-shadow: 0 10px 30px #00000015;
    }

    h1 {
      color: #6d28d9;
    }

    button {
      background: #6d28d9;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>This website is hosted for free on GitHub Pages.</p>
    <button onclick="alert('Thanks for visiting!')">
      Click Me
    </button>
  </div>
</body>
</html>
